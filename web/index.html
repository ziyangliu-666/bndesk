<!doctype html>
<html lang="en" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The desk's WebSocket opens while the scripts load, so its snapshot is on the way before they run; ws.ts takes
      // it over with the messages it has queued. Not in the mock build (VITE_MOCK=1).
      (function () {
        if ("%VITE_MOCK%" === "1") return;
        try {
          var q = [];
          var s = new WebSocket((location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws");
          s.binaryType = "arraybuffer";
          s.onmessage = function (e) {
            q.push(e.data);
          };
          window.__deskWs = { ws: s, queue: q };
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bndesk" />
    <title>bndesk</title>
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230B0E11%22/%3E%3Crect x=%227%22 y=%229%22 width=%2218%22 height=%225%22 fill=%22%232EBD85%22/%3E%3Crect x=%227%22 y=%2218%22 width=%2218%22 height=%225%22 fill=%22%23F6465D%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
